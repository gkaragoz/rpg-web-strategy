<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a2332" />
    <title>RPG Web - 3D prototype</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <script src="../coi-register.js"></script>
    <style>
      [hidden] { display: none !important; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1a2332; font-family: system-ui, sans-serif; color: #e6edf6;
        overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
      body { height: 100vh; height: 100dvh; user-select: none; -webkit-user-select: none; }
      #view { position: fixed; inset: 0; }
      #panel { position: fixed; top: 8px; left: 8px; width: 270px; max-height: calc(100dvh - 16px); overflow: auto; padding: 10px 12px;
        background: rgba(14, 20, 30, 0.86); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 10px; font-size: 13px; z-index: 5; }
      #panel h1 { margin: 0 0 6px; font-size: 15px; }
      #panel .row { display: flex; align-items: center; gap: 6px; margin: 5px 0; flex-wrap: wrap; }
      #panel label { min-width: 74px; opacity: 0.8; }
      #panel select, #panel input[type='number'] { flex: 1; min-width: 0; padding: 4px 6px; color: inherit; background: #0f1622; border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 6px; }
      #panel input[type='range'] { flex: 1; min-width: 0; }
      #panel button { padding: 6px 10px; color: inherit; background: #243349; border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 6px; cursor: pointer; font: inherit; }
      #panel button.on { background: #3b6fd0; border-color: #6c9bff; }
      #panel button.primary { background: #2f7d4a; border-color: #5fc486; }
      #panel .seg { display: flex; gap: 4px; flex: 1; }
      #panel .seg button { flex: 1; padding: 6px 4px; }
      #panel .help { opacity: 0.65; font-size: 11px; line-height: 1.35; margin-top: 8px; }
      #panel a { color: #8db4ff; }
      #toggle { display: none; position: fixed; top: 8px; left: 8px; z-index: 6; padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(14, 20, 30, 0.9); color: inherit; font: inherit; }
      #stats { position: fixed; top: 8px; right: 8px; padding: 6px 10px; background: rgba(14, 20, 30, 0.78); border-radius: 8px; font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre; z-index: 4; pointer-events: none; }
      #banner { position: fixed; left: 0; right: 0; top: 18%; text-align: center; font-size: 34px; font-weight: 700; text-shadow: 0 2px 10px #000; z-index: 4; pointer-events: none; }
      #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #1a2332; z-index: 20; font-size: 18px; }
      @media (max-width: 760px) {
        #panel { width: min(300px, calc(100vw - 16px)); top: 52px; }
        #panel.hidden { display: none; }
        #toggle { display: block; }
        #stats { top: 8px; right: 8px; font-size: 10px; }
        #banner { font-size: 24px; }
      }
    </style>
  </head>
  <body>
    <div id="loading">…</div>
    <div id="view"></div>
    <button id="toggle" type="button">☰</button>
    <div id="panel"></div>
    <div id="stats"></div>
    <div id="banner"></div>
    <script type="module" src="../src/render3d/main3d.ts"></script>
  </body>
</html>
