<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RPG Web - Savaş Stüdyosu</title>
    <script src="./coi-register.js"></script>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1a2332; font-family: system-ui, sans-serif; }
      canvas { display: block; }
      #stats { position: fixed; top: 8px; right: 8px; padding: 8px 10px; background: rgba(10,14,20,.78); color: #d8e2ee;
        font: 12px/1.45 ui-monospace, Consolas, monospace; border-radius: 6px; min-width: 210px; pointer-events: none; white-space: pre; z-index: 20; }
      #stats canvas { display: block; margin-top: 6px; }
      #banner { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: none;
        color: #fff; font-size: 34px; font-weight: 600; text-shadow: 0 2px 8px #000; text-align: center; z-index: 15; }
    </style>
  </head>
  <body>
    <div id="loading">Yükleniyor…</div>
    <div id="studio" class="studio" hidden></div>
    <div id="hud" class="hud" hidden></div>
    <div id="stats"></div>
    <div id="banner"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
