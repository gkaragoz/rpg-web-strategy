<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a2332" />
    <title>RPG Web - Battle Studio</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script src="./coi-register.js"></script>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1a2332; font-family: system-ui, sans-serif;
        overscroll-behavior: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
      body { height: 100vh; height: 100dvh; user-select: none; -webkit-user-select: none; }
      input, textarea { user-select: text; -webkit-user-select: text; }
      canvas { display: block; }
      #stats { position: fixed; top: 8px; right: 8px; padding: 8px 10px; background: rgba(10,14,20,.78); color: #d8e2ee;
        font: 12px/1.45 ui-monospace, Consolas, monospace; border-radius: 6px; min-width: 210px; pointer-events: none; white-space: pre; z-index: 20; }
      #stats canvas { display: block; margin-top: 6px; }
      #banner { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: none;
        color: #fff; font-size: 34px; font-weight: 600; text-shadow: 0 2px 8px #000; text-align: center; z-index: 15; }
    </style>
  </head>
  <body>
    <div id="loading"><div>Loading…</div><small>© gkaragoz and Contributors</small></div>
    <script>
      // Localize the loading text before the app bundle arrives (same language detection as src/i18n.ts).
      (function () {
        var l = 'en';
        try {
          var q = new URLSearchParams(location.search).get('lang');
          var s = q || localStorage.getItem('rpgweb.lang');
          if (s === 'tr' || s === 'en') l = s;
        } catch (e) {}
        document.documentElement.lang = l;
        if (l === 'tr') document.getElementById('loading').firstChild.textContent = 'Yükleniyor…';
      })();
    </script>
    <div id="studio" class="studio" hidden></div>
    <div id="hud" class="hud" hidden></div>
    <div id="stats"></div>
    <div id="banner"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
